# Produção (VPS). Só o que o proxy HTTPS precisa enxergar fica publicado,
# e apenas em 127.0.0.1. O banco e a API não têm porta aberta para fora.
services:
  db:
    image: postgres:16-alpine
    container_name: mapa365-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: pnpm --filter @mapa365/api start
    expose:
      - "3002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  bff:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: pnpm --filter @mapa365/bff start
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    environment:
      - API_URL=http://api:3002
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?defina ALLOWED_ORIGINS no .env}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: pnpm --filter @mapa365/web start
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_BFF_URL=${NEXT_PUBLIC_BFF_URL:?defina NEXT_PUBLIC_BFF_URL no .env}

volumes:
  postgres_data:
