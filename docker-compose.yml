# Produção (VPS). O banco e a API não têm porta aberta para fora.
# O MVP sobe só db e api; bff e frontend ficam em perfis para quando o chat do site e a área logada entrarem.
services:
  db:
    image: postgres:16-alpine
    container_name: mapa365-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    restart: always
    expose:
      - "3002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  bff:
    profiles: ["site"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bff
    restart: always
    expose:
      - "3001"
    depends_on:
      - api
    environment:
      - API_URL=http://api:3002
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}

  frontend:
    profiles: ["site"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: web
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-}
    restart: always
    expose:
      - "3000"

volumes:
  postgres_data:
