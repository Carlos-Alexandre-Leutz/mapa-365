services:
  db:
    image: postgres:16-alpine
    container_name: mapa365-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm --filter @mapa365/api exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @mapa365/api dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/node_modules/.bin
    ports:
      - "3002:3002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  bff:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @mapa365/bff dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - API_URL=http://api:3002

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @mapa365/web dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BFF_URL=http://localhost:3001

volumes:
  postgres_data:
